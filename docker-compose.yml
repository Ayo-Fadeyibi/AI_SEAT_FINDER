# Local PostgreSQL for FindaSpot development.
#
#   docker compose up -d db      # start Postgres in the background
#   docker compose down          # stop it (data is kept in the named volume)
#   docker compose down -v       # stop it AND wipe all data
#
# The backend connects via DATABASE_URL (see .env.example). These credentials
# are for local development only.
services:
  db:
    image: postgres:16
    container_name: findaspot-db
    environment:
      POSTGRES_DB: findaspot
      POSTGRES_USER: findaspot
      POSTGRES_PASSWORD: findaspot
    ports:
      - "5432:5432"
    volumes:
      - findaspot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findaspot -d findaspot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  findaspot-pgdata:
